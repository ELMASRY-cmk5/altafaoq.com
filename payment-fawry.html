<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الدفع - منصة التفوق</title>
  <style>
    :root{
      --accent:#1a237e;--accent2:#ffd600;--bg:#f7f3e3;--bg-dark:#181c24;--card:#fffbe6;--card-dark:#23283a;--muted:#6b7280;--muted-dark:#b0b6c3;--radius:16px;--shadow:0 8px 40px rgba(12,32,63,.13);--font:"Cairo", "Segoe UI", Arial, sans-serif;
      --pharaoh:#c7a76c;--papyrus:#f5e6c2;--border:#e0c68c;--gold:#ffd700;--sand:#d4a574;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --card: var(--card-dark);
        --muted: var(--muted-dark);
      }
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:#222;font-family:var(--font);transition:.2s}
    
    /* الـ Header الفرعوني */
    .site-header{
      background:linear-gradient(90deg,#fffbe6 0%,#f5e6c2 50%,#fffbe6 100%);
      box-shadow:0 4px 15px rgba(199,167,108,.25);
      position:sticky;top:0;z-index:10;border-bottom:4px solid var(--gold);
      padding:1.5rem 2rem;
    }
    
    .brand{margin:0;font-size:2.2rem;letter-spacing:2px;display:flex;align-items:center;gap:1rem;font-family:"Cairo",serif;text-decoration:none;color:var(--accent);font-weight:bold}
    .brand img{height:2.5rem;vertical-align:middle;filter:drop-shadow(0 3px 8px rgba(199,167,108,.3))}
    .brand-accent{color:var(--gold)}
    
    .container{max-width:600px;margin:0 auto;padding:2rem}
    
    .payment-section{
      background:var(--card);border:2px solid var(--pharaoh);border-radius:var(--radius);
      padding:2.5rem;box-shadow:var(--shadow);margin-top:2rem;
    }
    body.dark .payment-section{background:var(--card-dark);border-color:#444;color:#f3f6fa}
    
    .payment-title{
      text-align:center;font-size:2rem;color:var(--accent);margin-bottom:0.5rem;font-family:"Cairo",serif;
    }
    
    .payment-subtitle{text-align:center;color:var(--muted);margin-bottom:2rem}
    
    .payment-card{
      background:linear-gradient(135deg,var(--gold),var(--sand));
      padding:1.5rem;border-radius:12px;margin-bottom:2rem;color:#fff;
      box-shadow:0 8px 25px rgba(199,167,108,.3);position:relative;overflow:hidden;
    }
    
    .payment-card::before{
      content:'';position:absolute;top:0;right:0;width:100px;height:100px;
      background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,.1) 10px,rgba(255,255,255,.1) 20px);
      border-radius:50%;
    }
    
    .payment-details{position:relative;z-index:1}
    
    .payment-details h4{font-size:1.1rem;margin-bottom:1rem;opacity:.95}
    
    .detail-row{display:flex;justify-content:space-between;margin-bottom:0.8rem;padding-bottom:0.8rem;border-bottom:1px solid rgba(255,255,255,.2)}
    .detail-row:last-child{border-bottom:none}
    
    .detail-label{opacity:.85}
    .detail-value{font-weight:bold;font-size:1.15rem}
    
    .form-group{margin-bottom:1.5rem}
    
    label{display:block;margin-bottom:0.6rem;font-weight:600;color:var(--accent)}
    
    input,select{
      width:100%;padding:0.8rem 1rem;border:1.5px solid var(--pharaoh);
      border-radius:8px;font-size:1rem;background:var(--papyrus);color:#222;
      font-family:var(--font);transition:.2s;
    }
    body.dark input,body.dark select{background:#303a47;border-color:#404a57;color:#e8e8e8}
    
    input:focus,select:focus{outline:0;border-color:var(--accent2);box-shadow:0 0 8px #ffd60040}
    
    .payment-method{margin-bottom:2rem}
    .payment-method h4{color:var(--accent);margin-bottom:1rem}
    
    .method-option{
      display:flex;gap:1rem;align-items:center;padding:1rem;border:2px solid var(--pharaoh);
      border-radius:10px;margin-bottom:1rem;cursor:pointer;transition:.2s;background:var(--papyrus);
    }
    body.dark .method-option{background:rgba(255,255,255,.05);border-color:#555}
    
    .method-option:hover{background:var(--accent2);border-color:var(--gold)}
    .method-option input[type="radio"]{cursor:pointer;width:20px;height:20px}
    .method-label{font-weight:600;color:var(--accent);cursor:pointer;flex:1}
    
    .submit-btn{
      width:100%;padding:1rem;background:var(--gold);color:#fff;border:none;
      border-radius:10px;cursor:pointer;font-weight:700;font-size:1.1rem;
      transition:.3s;box-shadow:var(--shadow);font-family:var(--font);
    }
    .submit-btn:hover{background:var(--accent2);transform:scale(1.02);color:var(--accent)}
    .submit-btn:disabled{background:var(--muted);cursor:not-allowed;transform:none}
    
    .back-link{
      display:inline-block;margin-top:1.5rem;color:var(--accent);
      text-decoration:none;font-weight:600;transition:.2s;
    }
    .back-link:hover{color:var(--gold);text-decoration:underline}
    
    .info-box{
      background:linear-gradient(135deg,#e3f2fd,#f3e5f5);border:2px solid var(--pharaoh);
      border-radius:10px;padding:1rem;margin-bottom:1.5rem;
    }
    body.dark .info-box{background:rgba(100,150,255,.1);border-color:#555}
    
    .info-box h5{color:var(--accent);margin-bottom:0.5rem}
    .info-box p{color:var(--muted);font-size:.95rem;line-height:1.6}
    
    .fawry-logo{
      text-align:center;font-size:2rem;margin-bottom:1rem;
    }
    
    body.dark{background:var(--bg-dark);color:#f3f6fa}
    body.dark .site-header{background:linear-gradient(90deg,#23283a 0%,#1a1f2e 50%,#23283a 100%)}
    
    footer{background:var(--card);padding:1.5rem;text-align:center;margin-top:3rem;border-top:2px solid var(--pharaoh)}
    body.dark footer{background:var(--card-dark);border-top-color:#444;color:#f3f6fa}
    footer p{color:var(--muted);margin:0;font-size:.9rem}
    
    @media(max-width:768px){
      .container{padding:1rem}
      .payment-section{padding:1.5rem}
      .payment-title{font-size:1.5rem}
    }
  </style>
  <script src="/advanced-storage.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/home.html" class="brand">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBcTf0pcoW5Bwz1GdzTdJyWqlTc9_RIS2G5Q&s" alt="شعار التفوق" style="height:2.7rem;vertical-align:middle;filter:drop-shadow(0 2px 6px #c7a76c80)" />
        منصة <span class="brand-accent">التفوق</span>
      </a>
    </div>
  </header>

  <div class="container">
    <div class="payment-section">
      <div class="fawry-logo">💳</div>
      
      <h2 class="payment-title">الدفع الفرعوني الملكي 👑</h2>
      <p class="payment-subtitle">أكمل عملية الدفع لتأكيد اشتراكك</p>

      <div id="paymentCardContainer"></div>

      <div class="info-box">
        <h5>ℹ️ معلومات الدفع</h5>
        <p>سيتم إرسال طلب الدفع الخاص بك إلى لوحة الأدمن. سيقوم الأدمن بمراجعة بيانات الحوالة والموافقة أو الرفض.</p>
      </div>

      <form id="paymentForm" onsubmit="submitPayment(event)">
        <div class="payment-method">
          <h4>📱 طريقة الدفع</h4>
          
          <div class="method-option">
            <input type="radio" id="fawry" name="paymentMethod" value="fawry" checked />
            <label for="fawry" class="method-label">فودافون كاش 📱 (Vodafone Cash)</label>
          </div>
          
          <div class="method-option">
            <input type="radio" id="fawryPaypoint" name="paymentMethod" value="fawryPaypoint" />
            <label for="fawryPaypoint" class="method-label">فاوري (Fawry)</label>
          </div>
        </div>

        <div class="form-group">
          <label for="phoneNumber">رقم الهاتف الذي سيتم الدفع من خلاله *</label>
          <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="01XXXXXXXXX" pattern="^01[0-9]{9}$" required />
        </div>

        <div class="form-group">
          <label for="transactionId">رقم العملية / المرجع *</label>
          <input type="text" id="transactionId" name="transactionId" placeholder="أدخل رقم العملية أو المرجع" required />
        </div>

        <div class="form-group">
          <label for="notes">ملاحظات إضافية (اختياري)</label>
          <input type="text" id="notes" name="notes" placeholder="أي ملاحظات تريد إضافتها؟" />
        </div>

        <button type="submit" class="submit-btn">✅ تأكيد طلب الدفع</button>
      </form>

      <a href="/student-home.html" class="back-link">← العودة للكورسات</a>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 منصة التفوق التعليمية. جميع الحقوق محفوظة.</p>
  </footer>

  <script>
    const subscription = JSON.parse(localStorage.getItem('pendingSubscription') || '{}');
    const currentStudent = JSON.parse(localStorage.getItem('currentStudent') || '{}');

    // عرض تفاصيل العملية
    function displayPaymentCard() {
      if (!subscription.courseId) {
        window.location.href = '/student-home.html';
        return;
      }

      const total = subscription.price || 0;
      const tax = Math.round(total * 0.14); // 14% ضريبة
      const finalAmount = total + tax;

      document.getElementById('paymentCardContainer').innerHTML = `
        <div class="payment-card">
          <div class="payment-details">
            <h4>📚 تفاصيل الاشتراك</h4>
            <div class="detail-row">
              <span class="detail-label">الكورس:</span>
              <span class="detail-value">${subscription.courseTitle}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">سعر الكورس:</span>
              <span class="detail-value">${subscription.price} ج.م</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">الضريبة (14%):</span>
              <span class="detail-value">${tax} ج.م</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">المبلغ النهائي:</span>
              <span class="detail-value">${finalAmount} ج.م</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">الطالب:</span>
              <span class="detail-value">${subscription.studentName}</span>
            </div>
          </div>
        </div>
      `;
    }

    function submitPayment(event) {
      event.preventDefault();

      const paymentData = {
        id: 'p_' + Date.now(),
        studentId: subscription.studentId,
        studentName: subscription.studentName,
        studentPhone: subscription.studentPhone,
        courseId: subscription.courseId,
        courseTitle: subscription.courseTitle,
        amount: subscription.price,
        tax: Math.round(subscription.price * 0.14),
        totalAmount: subscription.price + Math.round(subscription.price * 0.14),
        paymentMethod: document.getElementById('fawry').checked ? 'fawry' : 'fawryPaypoint',
        phoneNumber: document.getElementById('phoneNumber').value,
        transactionId: document.getElementById('transactionId').value,
        notes: document.getElementById('notes').value,
        status: 'pending', // قيد المراجعة من الأدمن
        createdAt: new Date().toISOString(),
        adminResponse: null
      };

      // حفظ طلب الدفع
      const paymentRequests = advancedStorage.getPaymentRequests?.() || [];
      paymentRequests.push(paymentData);
      
      // حفظ في التخزين
      try {
        const storage = localStorage;
        if (!storage.getItem('tf_payments')) {
          storage.setItem('tf_payments', JSON.stringify([]));
        }
        const payments = JSON.parse(storage.getItem('tf_payments') || '[]');
        payments.push(paymentData);
        storage.setItem('tf_payments', JSON.stringify(payments));
      } catch (e) {
        console.log('حفظ بديل في sessionStorage');
        const payments = JSON.parse(sessionStorage.getItem('tf_payments') || '[]');
        payments.push(paymentData);
        sessionStorage.setItem('tf_payments', JSON.stringify(payments));
      }

      // عرض رسالة النجاح
      alert(`✅ تم إرسال طلب الدفع بنجاح!\n\nرقم العملية: ${paymentData.id}\n\nسيتم مراجعته من قبل الأدمن قريباً`);

      // مسح البيانات المؤقتة
      localStorage.removeItem('pendingSubscription');

      // العودة للصفحة الرئيسية
      window.location.href = '/student-home.html';
    }

    // تحميل البيانات عند فتح الصفحة
    displayPaymentCard();

    // التحقق من تسجيل الدخول
    if (!currentStudent.id) {
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
