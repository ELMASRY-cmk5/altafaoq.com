<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>التفوق ستور — متجر منصة التفوق</title>
  <style>
    :root {
      --accent: #1a237e;
      --accent2: #ffd600;
      --bg: #f7f3e3;
      --bg-dark: #181c24;
      --card: #ffffff;
      --card-dark: #252c38;
      --text: #222222;
      --text-dark: #e8e8e8;
      --muted: #666;
      --muted-dark: #bbb;
      --pharaoh: #c7a76c;
      --papyrus: #f5e6c2;
      --radius: 8px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
    }
    
    body.dark-mode {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }
    
    .site-header {
      background-color: var(--card);
      padding: 1rem 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.3s;
      border-bottom: 2px solid var(--pharaoh);
    }
    
    body.dark-mode .site-header {
      background-color: var(--card-dark);
    }
    
    .site-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }
    
    .brand {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .brand img {
      width: 30px;
      height: 30px;
    }
    
    .brand-accent {
      color: var(--accent2);
    }
    
    nav {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }
    
    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }
    
    body.dark-mode nav a {
      color: var(--text-dark);
    }
    
    nav a:hover,
    nav a.active {
      color: var(--accent2);
    }
    
    .theme-toggle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), #ffb300);
      border: 2px solid var(--pharaoh);
      cursor: pointer;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      box-shadow: 0 2px 8px #c7a76c30;
    }
    
    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 12px #c7a76c50;
    }
    
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    
    .store-hero {
      padding: 3rem 2rem 2rem;
      text-align: center;
      background: linear-gradient(120deg, #f7f3e3 60%, #f5e6c2 100%);
      border-bottom: 2px solid var(--pharaoh);
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    
    .store-hero h2 {
      font-size: 2.5rem;
      margin-bottom: 0.7rem;
      color: var(--accent);
    }
    
    .store-hero p {
      color: #666;
      font-size: 1.1rem;
    }
    
    body.dark-mode .store-hero p {
      color: #bbb;
    }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
      justify-items: center;
      margin-top: 2rem;
    }
    
    .product-card {
      background-color: var(--card);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s;
      border: 2px solid var(--pharaoh);
      min-width: 220px;
    }
    
    body.dark-mode .product-card {
      background-color: var(--card-dark);
    }
    
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
    
    .product-card img {
      width: 90px;
      height: 90px;
      margin-bottom: 1rem;
    }
    
    .product-card h4 {
      margin: 0 0 0.5rem 0;
      font-size: 1.2rem;
      color: var(--accent);
    }
    
    .product-card p {
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    
    body.dark-mode .product-card p {
      color: var(--muted-dark);
    }
    
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--pharaoh);
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 2px 8px rgba(26, 35, 126, 0.2);
      transition: all 0.3s;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      width: 100%;
    }
    
    .btn:hover {
      background-color: #0d1b5e;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(26, 35, 126, 0.3);
    }
    
    .btn.secondary {
      background-color: var(--accent2);
      color: #222;
    }
    
    .btn.secondary:hover {
      background-color: #ffcc00;
    }
    
    .site-footer {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      border-top: 2px solid var(--pharaoh);
      background-color: var(--card);
      transition: background-color 0.3s;
    }
    
    body.dark-mode .site-footer {
      background-color: var(--card-dark);
      border-top-color: #404a57;
      color: var(--muted-dark);
    }
    
    @media (max-width: 900px) {
      .site-header .container {
        flex-direction: column;
        align-items: flex-start;
      }
      
      nav {
        margin-top: 1rem;
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="brand">
        <img src="https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/pharaoh-logo.svg" alt="شعار التفوق الفرعوني" />
        منصة <span class="brand-accent">التفوق</span>
      </span>
      <nav>
        <a href="/home.html">الرئيسية</a>
        <a href="/store.html" class="active">التفوق ستور</a>
        <a href="/login.html">تسجيل الدخول</a>
        <a href="/signup.html">إنشاء حساب</a>
        <button class="theme-toggle" id="themeToggle" title="تبديل الوضع">🌓</button>
      </nav>
    </div>
  </header>
  <main>
    <section class="store-hero">
      <h2>التفوق ستور</h2>
      <p>كل ما يحتاجه الطالب والمعلم من كتب، ملخصات، أدوات، واشتراكات مميزة.</p>
      <div style="margin-top:1.5rem">
        <a href="/checkout.html" id="checkoutBtn" class="btn" style="display:none;max-width:200px;background-color:#27ae60">اذهب للدفع والتوصيل</a>
      </div>
    </section>
    <div class="container">
      <div class="products-grid" id="productsContainer"></div>
    </div>
  </main>
  <footer class="site-footer container">
    <p>© <span id="year"></span> منصة التفوق — جميع الحقوق محفوظة</p>
  </footer>
  <script>
  document.addEventListener('DOMContentLoaded',()=>{
    const yearEl=document.getElementById('year');if(yearEl)yearEl.textContent=new Date().getFullYear();
    const themeBtn = document.getElementById('themeToggle');
    if(themeBtn){
      themeBtn.onclick = function(){
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('tf_theme',document.body.classList.contains('dark-mode')?'dark':'light');
      };
      if(localStorage.getItem('tf_theme')==='dark') document.body.classList.add('dark-mode');
    }

    // Load and display products
    const Products = {
      list: () => JSON.parse(localStorage.getItem('tf_products')||'[]'),
      initSample: function(){
        if(!this.list().length){
          const sampleProducts = [
            {id:'p_1',name:'كتاب التفوق للثانوي',description:'كتاب شامل للمراجعة النهائية والأسئلة المتوقعة.',price:150,image:'https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/book.svg',category:'books',stock:50},
            {id:'p_2',name:'ملخصات الرياضيات PDF',description:'ملخصات مركزة لكل المواد، جاهزة للتحميل.',price:50,image:'https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/summary.svg',category:'notes',stock:100},
            {id:'p_3',name:'أدوات تنظيم المذاكرة',description:'أدوات تنظيم الوقت، جداول مذاكرة، وقوالب متابعة.',price:75,image:'https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/tools.svg',category:'tools',stock:30},
            {id:'p_4',name:'اشتراك مميز (شهري)',description:'احصل على مزايا إضافية ودعم مباشر من المدرسين.',price:200,image:'https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/subscription.svg',category:'subscriptions',stock:999}
          ];
          localStorage.setItem('tf_products',JSON.stringify(sampleProducts));
        }
      }
    };

    Products.initSample();
    renderProducts();

    function renderProducts(){
      const products = Products.list();
      const container = document.getElementById('productsContainer');
      if(!products.length) return container.innerHTML = '<p class="muted" style="text-align:center;grid-column:1/-1">لا توجد منتجات حالياً</p>';
      
      container.innerHTML = products.map(p=>`
        <div class="product-card">
          <img src="${p.image||'https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/box.svg'}" alt="${p.name}" />
          <h4>${p.name}</h4>
          <p>${p.description}</p>
          <p style="color:var(--accent2);font-weight:bold;margin-bottom:1rem">${p.price} ج.م</p>
          <button class="btn" onclick="addToCart('${p.id}','${p.name}',${p.price})">إضافة للسلة</button>
        </div>
      `).join('');
    }

    window.addToCart = function(productId, productName, productPrice){
      let cart = JSON.parse(localStorage.getItem('tf_cart')||'[]');
      const item = cart.find(c => c.productId === productId);
      if(item) item.quantity++;
      else cart.push({productId,productName,productPrice,quantity:1});
      localStorage.setItem('tf_cart',JSON.stringify(cart));
      
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = cartCount;
      alert(productName + ' تمت إضافته للسلة');
      
      // Show checkout button
      document.getElementById('checkoutBtn').style.display = 'block';
    };

    // Update cart count
    const cart = JSON.parse(localStorage.getItem('tf_cart')||'[]');
    const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
    if(cartCount > 0) document.getElementById('checkoutBtn').style.display = 'block';
  });
  </script>
</body>
</html>
