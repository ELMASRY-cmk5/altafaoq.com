<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>الملف الشخصي — التفوق</title>
    <style>
    :root{--accent:#1a237e;--accent2:#ffd600;--bg:#f7f3e3;--bg-dark:#181c24;--card:#fffbe6;--card-dark:#23283a;--muted:#6b7280;--muted-dark:#b0b6c3;--radius:16px;--shadow:0 8px 40px rgba(12,32,63,.13);--font:"Cairo", "Segoe UI", Arial, sans-serif;--pharaoh:#c7a76c;--papyrus:#f5e6c2;--border:#e0c68c;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#222;font-family:var(--font)}
    .container{max-width:1150px;margin:0 auto;padding:1.7rem}
    .site-header{background:linear-gradient(90deg,#fffbe6 70%,#f5e6c2 100%);box-shadow:0 2px 8px rgba(199,167,108,.08);position:sticky;top:0;z-index:10;border-bottom:2px solid var(--border)}
    .site-header .container{display:flex;align-items:center;justify-content:space-between;padding:1.3rem 1.7rem}
    .brand{margin:0;font-size:2.3rem;letter-spacing:1px;display:flex;align-items:center;gap:.7rem;font-family:"Cairo",serif}
    .brand img{height:2.7rem;vertical-align:middle;filter:drop-shadow(0 2px 6px #c7a76c80)}
    .brand-accent{color:var(--accent2);font-weight:bold;text-shadow:0 2px 8px #c7a76c60}
    nav{display:flex;align-items:center;gap:1.3rem}
    nav a{font-size:1.15rem;text-decoration:none;color:var(--muted);transition:.2s;font-weight:500;letter-spacing:.5px}
    nav a.active,nav a:hover{color:var(--accent2);text-shadow:0 2px 8px #c7a76c40}
    .card{background:var(--card);padding:2rem 1.5rem;border-radius:var(--radius);box-shadow:var(--shadow);max-width:520px;margin:0 auto;border:2px solid var(--pharaoh)}
    .muted{color:var(--muted)}
    body.dark{background:var(--bg-dark);color:#f3f6fa}
    body.dark .site-header{background:linear-gradient(90deg,#23283a,#23283a 100%);border-bottom:2px solid #444}
    body.dark .card{background:var(--card-dark);color:#f3f6fa;border-color:#444}
    .site-footer{padding:2.2rem 0 1.2rem 0;text-align:center;color:var(--muted);font-size:1.08rem;background:var(--papyrus);border-top:2px solid var(--border);margin-top:2.5rem}
    .footer-social{margin:1.2rem 0;display:flex;justify-content:center;gap:1.7rem}
    .footer-social a{display:inline-block;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px #c7a76c30;border:2px solid var(--pharaoh);display:flex;align-items:center;justify-content:center;transition:.2s}
    .footer-social a:hover{background:var(--accent2);border-color:var(--accent);box-shadow:0 4px 16px #ffd60060}
    .footer-social img{width:22px;height:22px}
    body.dark .site-footer{background:var(--card-dark);color:var(--muted-dark);border-top:2px solid #444}
    body.dark .footer-social a{background:var(--card-dark);border-color:var(--accent2)}
    </style>
  </head>
  <body>
    <header class="site-header"><div class="container"><span class="brand">
        <img src="https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/pharaoh-logo.svg" alt="شعار التفوق الفرعوني" />
        منصة <span class="brand-accent">التفوق</span>
      </span>
      <nav><a href="/dashboard.html">لوحة التحكم</a><a href="/students.html">الطلاب</a></nav>
    </div></header>
    <main class="container" style="padding:2.5rem 0">
      <div class="card">
        <h2 style="text-align:center;color:var(--accent);font-family:'Cairo',serif;margin-bottom:1.2rem">الملف الشخصي</h2>
        <div id="profile"></div>
      </div>
    </main>
    <script>
    // inline app + page script
    const Auth=(function(){
      return {
        requestRegistration: async (reg) => {
          const regs = JSON.parse(localStorage.getItem('tf_registrations')||'[]');
          if (regs.find(r=>r.studentNumber===reg.studentNumber)) throw new Error('يوجد طلب سابق لهذا الرقم');
          reg.id = 'r_'+Date.now(); reg.status='pending'; regs.push(reg); localStorage.setItem('tf_registrations', JSON.stringify(regs)); return reg;
        },
        login: async ({studentNumber,password}) => {
          const users = JSON.parse(localStorage.getItem('tf_users')||'[]');
          const u = users.find(x=>x.studentNumber===studentNumber && x.password===password && x.status==='active');
          if(!u) throw new Error('بيانات الدخول غير صحيحة');
          const user = {id:u.id,name:u.name,studentNumber:u.studentNumber,role:u.role}; localStorage.setItem('tf_current', JSON.stringify(user)); return user;
        },
        logout: ()=>{ localStorage.removeItem('tf_current') },
        currentUser: ()=> JSON.parse(localStorage.getItem('tf_current')||'null')
      }
    })();
    function requireAuth(redirectTo='/login.html'){const u=Auth.currentUser();if(!u){window.location.href=redirectTo;return null}return u}
    const Students=(function(){return{list:()=>JSON.parse(localStorage.getItem('tf_students')||'[]'),save:(student)=>{const all=Students.list();if(!student.id)student.id='s_'+Date.now();all.push(student);localStorage.setItem('tf_students',JSON.stringify(all));return student},delete:(id)=>{let all=Students.list().filter(s=>s.id!==id);localStorage.setItem('tf_students',JSON.stringify(all))}}})();
    window.TF={Auth,Students,requireAuth};

    (function page(){
      const user = TF.requireAuth();
      const el = document.getElementById('profile');
      el.innerHTML = `<p><strong>الاسم:</strong> ${user.name}</p><p><strong>الرقم:</strong> ${user.studentNumber||''}</p><p><strong>الدور:</strong> ${user.role}</p>`
    })();
    </script>
    <footer class="site-footer container">
      <div class="footer-social">
        <a href="https://wa.me/201234567890" target="_blank" title="واتساب"><img src="https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/social-whatsapp.svg" alt="واتساب" /></a>
        <a href="https://t.me/altafaoq" target="_blank" title="تليجرام"><img src="https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/social-telegram.svg" alt="تليجرام" /></a>
        <a href="https://facebook.com/altafaoq" target="_blank" title="فيسبوك"><img src="https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/social-facebook.svg" alt="فيسبوك" /></a>
        <a href="https://youtube.com/@altafaoq" target="_blank" title="يوتيوب"><img src="https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/social-youtube.svg" alt="يوتيوب" /></a>
        <a href="mailto:info@altafaoq.com" target="_blank" title="البريد الإلكتروني"><img src="https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/social-email.svg" alt="البريد الإلكتروني" /></a>
        <a href="tel:+201234567890" target="_blank" title="اتصل بنا"><img src="https://cdn.jsdelivr.net/gh/ELMASRY-cmk5/placeholder-images/social-phone.svg" alt="اتصل بنا" /></a>
      </div>
      <p>© <span id="year"></span> منصة التفوق — جميع الحقوق محفوظة</p>
    </footer>
  </body>
  </html>
